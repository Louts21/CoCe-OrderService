services:
  order-service:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/coce_orders
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - FRONTEND_URL=http://localhost:3000
      - FRONTEND_URL_PATH=http://localhost:3000/order/
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=coce_orders
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
